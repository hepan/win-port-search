name: Windows build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  win7-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly standard-library sources
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Build Windows 7-compatible x64 target
        run: cargo +nightly build -Z build-std=std,panic_abort --target x86_64-win7-windows-msvc --release --locked
      - name: Inspect embedded administrator manifest
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'target/x86_64-win7-windows-msvc/release/win-port-search.exe').Path
          $manifest = Join-Path $env:RUNNER_TEMP 'app.manifest'
          $kits = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $mt = Get-ChildItem (Join-Path $kits 'bin\*\x64\mt.exe') | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK mt.exe missing' }
          & $mt.FullName "-inputresource:${exe};#1" "-out:${manifest}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $manifest -Pattern 'requireAdministrator' -Quiet)) { throw 'Administrator manifest missing' }
      - name: Smoke TCP and UDP owner lookup on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests | Out-Null
          @'
          #[path = "../src/data.rs"]
          mod data;

          #[test]
          fn current_process_owns_bound_tcp_and_udp_ports() {
              let tcp = std::net::TcpListener::bind(("127.0.0.1", 0)).unwrap();
              let udp = std::net::UdpSocket::bind(("127.0.0.1", 0)).unwrap();
              let rows = data::collect().unwrap();
              let pid = std::process::id();
              assert!(rows.iter().any(|r|
                  r.protocol == "TCP" && r.port == tcp.local_addr().unwrap().port() && r.pid == pid
              ), "bound TCP listener missing");
              assert!(rows.iter().any(|r|
                  r.protocol == "UDP" && r.port == udp.local_addr().unwrap().port() && r.pid == pid
              ), "bound UDP endpoint missing");
          }
          '@ | Set-Content -Path tests/smoke.rs -Encoding utf8
          cargo +nightly test -Z build-std=std,panic_abort --target x86_64-win7-windows-msvc --test smoke --release --locked
      - name: Smoke GUI search and refresh on Windows
        timeout-minutes: 2
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class Gui {
              public delegate bool ChildCallback(IntPtr hwnd, IntPtr data);
              [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr parent, int id);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern bool SetWindowText(IntPtr hwnd, string text);
              [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hwnd, uint message, IntPtr wparam, IntPtr lparam);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int length);
              [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr parent, ChildCallback callback, IntPtr data);
          }
          '@
          $exe = (Resolve-Path 'target/x86_64-win7-windows-msvc/release/win-port-search.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $window = [IntPtr]::Zero
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              $window = $process.MainWindowHandle
              if ($window -ne [IntPtr]::Zero) { break }
              if ($process.HasExited) { throw 'GUI exited before displaying a window' }
            }
            if ($window -eq [IntPtr]::Zero) { throw 'GUI window did not open' }
            $edit = [Gui]::GetDlgItem($window, 104)
            $search = [Gui]::GetDlgItem($window, 101)
            $refresh = [Gui]::GetDlgItem($window, 102)
            if ($edit -eq [IntPtr]::Zero -or $search -eq [IntPtr]::Zero -or $refresh -eq [IntPtr]::Zero) { throw 'Search controls missing' }
            function Get-Status {
              $script:status = ''
              $callback = [Gui+ChildCallback]{
                param($child, $unused)
                $text = [System.Text.StringBuilder]::new(2048)
                [void][Gui]::GetWindowText($child, $text, $text.Capacity)
                if ($text.ToString() -match 'Updated|Query failed|Enter an exact port') { $script:status = $text.ToString() }
                return $true
              }
              [void][Gui]::EnumChildWindows($window, $callback, [IntPtr]::Zero)
              return $script:status
            }
            for ($i = 0; $i -lt 40; $i++) {
              if ((Get-Status) -match 'Updated') { break }
              Start-Sleep -Milliseconds 250
            }
            if ((Get-Status) -notmatch 'Updated') { throw "Initial query failed: $(Get-Status)" }
            if (-not [Gui]::SetWindowText($edit, 'bad-port')) { throw 'Could not set port text' }
            [void][Gui]::SendMessage($window, 0x0111, [IntPtr]101, $search)
            $afterInvalid = Get-Status
            if ($afterInvalid -notmatch 'Enter an exact port') {
              $inputText = [System.Text.StringBuilder]::new(64)
              [void][Gui]::GetWindowText($edit, $inputText, $inputText.Capacity)
              throw "Invalid search was not rejected: status=$afterInvalid edit=$inputText"
            }
            [void][Gui]::SetWindowText($edit, '65535')
            [void][Gui]::SendMessage($window, 0x0111, [IntPtr]101, $search)
            if ((Get-Status) -notmatch 'port 65535') { throw "Exact search was not applied: $(Get-Status)" }
            [void][Gui]::SetWindowText($edit, '1234')
            [void][Gui]::SendMessage($window, 0x0111, [IntPtr]102, $refresh)
            if ((Get-Status) -notmatch 'port 65535') { throw "Refresh lost the applied filter: $(Get-Status)" }
          }
          finally {
            if (-not $process.HasExited) { $process.Kill(); $process.WaitForExit() }
          }
