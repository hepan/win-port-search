<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>端口查看器 · 界面草图（非产品）</title>
<style>
:root{font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#172132;background:#f3f5f8}*{box-sizing:border-box}body{margin:0;padding:28px 32px 110px}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 15px}small,.muted{color:#667589}button,input{font:inherit}button{border:1px solid #9daec3;background:white;border-radius:7px;padding:8px 14px;cursor:pointer}button.primary{background:#2358a8;color:white;border-color:#2358a8}input{padding:9px 12px;border:1px solid #a8b6c8;border-radius:7px;width:190px}.box{background:white;border:1px solid #dce3eb;border-radius:12px;padding:20px;margin-top:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.banner{margin-top:18px;padding:12px 16px;border-radius:8px;background:#e8f0ff;color:#173b75}.error{background:#ffebe8;color:#8a281d}.pill{font-size:12px;padding:3px 8px;background:#e7f1f7;border-radius:12px}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #e4e9f0;vertical-align:top}th{color:#566276;font-weight:600}td.path{overflow-wrap:anywhere;max-width:310px}.row{display:flex;justify-content:space-between;align-items:start;gap:18px;padding:18px;border-bottom:1px solid #e4e9f0}.row:last-child{border:0}.focus{font-size:28px;font-weight:700}.wide{max-width:1060px;margin:auto}.columns{display:grid;grid-template-columns:240px 1fr;gap:18px}.side{display:flex;flex-direction:column;gap:10px}.side button{text-align:left}.active{border-color:#2358a8!important;background:#e8f0ff!important}.bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#182e52;color:white;padding:8px;border-radius:26px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 22px #0003;white-space:nowrap}.bar button{border:0;border-radius:100%;width:34px;height:34px;padding:0}header p{margin:6px 0 0}@media(max-width:720px){body{padding:14px 12px 85px}.top,.columns{display:block}.actions{margin-top:15px}table{font-size:12px}}
</style>
<header class="top"><div><h1>本机端口查看器 <small>· 非产品草图</small></h1><p class="muted">静态示例数据；搜索和刷新仅演示界面状态，不读取系统端口。</p></div><div class="actions"><input id="port" aria-label="精确端口号" placeholder="端口号，如 8080"><button class="primary" id="search">搜索</button><button id="refresh">刷新</button></div></header>
<div id="message" class="banner">就绪 · 展示全部 TCP 监听与 UDP 端点</div><main id="view"></main>
<nav class="bar" aria-label="草图切换"><button id="prev" aria-label="上一种布局">←</button><span id="variant-name"></span><button id="next" aria-label="下一种布局">→</button></nav>
<script>
// 问题：哪种布局让用户最快从端口定位 PID、进程名及路径？三种草图通过 ?variant=A|B|C 切换。
const rows=[
{protocol:'TCP',port:8080,pid:4240,name:'server.exe',path:'C:\\apps\\server\\server.exe',count:2},
{protocol:'TCP',port:8080,pid:8912,name:'worker.exe',path:'C:\\apps\\worker.exe',count:1},
{protocol:'UDP',port:5353,pid:0,name:'无法归属进程',path:'不可获取：PID 0',count:1},
{protocol:'TCP',port:443,pid:660,name:'System',path:'不可获取：受保护进程',count:1},
{protocol:'UDP',port:1900,pid:920,name:'svchost.exe',path:'C:\\Windows\\System32\\svchost.exe',count:2}
];
const labels={A:'A · 密集表格',B:'B · 搜索优先',C:'C · 按协议浏览'};let variant=new URLSearchParams(location.search).get('variant');if(!labels[variant])variant='A';let shown=rows.slice(),query='',cycle=0;
const safe=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function item(r){return `<div class="row"><div><span class="pill">${r.protocol}</span> <strong class="focus">${r.port}</strong><div class="muted">${r.count>1?r.count+' 条端点（本机地址未显示）':'1 条端点'}</div></div><div><b>PID ${r.pid}</b> · ${safe(r.name)}<div class="muted">${safe(r.path)}</div></div></div>`}
function draw(){document.querySelector('#variant-name').textContent=labels[variant];let data=shown,html='';if(variant==='A'){html=`<section class="box"><h2>端点列表 <small>${data.length} 组</small></h2><table><thead><tr><th>协议</th><th>本机端口</th><th>PID</th><th>进程名</th><th>运行路径 / 不可获取原因</th><th>端点数</th></tr></thead><tbody>${data.map(r=>`<tr><td>${r.protocol}</td><td><b>${r.port}</b></td><td>${r.pid}</td><td>${safe(r.name)}</td><td class="path">${safe(r.path)}</td><td>${r.count}</td></tr>`).join('')}</tbody></table>${!data.length?'<p>未找到该端口</p>':''}</section>`}else if(variant==='B'){html=`<div class="wide"><section class="box"><h2>${query?'端口 '+query+' · 查询结果':'查找端口'}</h2><p class="muted">${query?'同一端口可以有多个进程或协议。':'输入端口并点击搜索；未输入时浏览全部端点。'}</p>${data.map(item).join('')||'<p>未找到该端口</p>'}</section></div>`}else{html=`<div class="columns"><aside class="box side"><h2>协议</h2><button class="active">全部 · ${data.length}</button><button>TCP 监听 · ${data.filter(r=>r.protocol==='TCP').length}</button><button>UDP 端点 · ${data.filter(r=>r.protocol==='UDP').length}</button><p class="muted">草图：协议导航仅展示布局；顶部搜索和刷新可交互。</p></aside><section class="box"><h2>浏览本机端点</h2>${data.map(item).join('')||'<p>未找到该端口</p>'}</section></div>`}document.querySelector('#view').innerHTML=html}
function status(text,error=false){const el=document.querySelector('#message');el.textContent=text;el.className='banner'+(error?' error':'')}
function run(){const raw=document.querySelector('#port').value.trim();if(raw&&!/^\d+$/.test(raw)||raw&&Number(raw)>65535){status('端口号无效：请输入 0–65535 的整数。未执行查询。',true);return}query=raw;shown=raw?rows.filter(r=>r.port===Number(raw)):rows.slice();cycle++;status(`示例查询 ${cycle} · ${new Date().toLocaleTimeString()} · ${raw?'精确端口 '+raw:'全部端点'} · ${shown.length} 组`);draw()}
function switchTo(next){variant=next;const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);draw()}
document.querySelector('#search').onclick=run;document.querySelector('#refresh').onclick=run;document.querySelector('#prev').onclick=()=>switchTo('ABC'[('ABC'.indexOf(variant)+2)%3]);document.querySelector('#next').onclick=()=>switchTo('ABC'[('ABC'.indexOf(variant)+1)%3]);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')document.querySelector('#prev').click();if(e.key==='ArrowRight')document.querySelector('#next').click()});draw();
</script></html>
